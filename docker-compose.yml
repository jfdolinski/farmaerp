name: farmaerp

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copie .env.example para .env}
      POSTGRES_DB: ${DB_NAME:-farmaerp}
      FARMAERP_MIGRATOR_PASSWORD: ${FARMAERP_MIGRATOR_PASSWORD:?Copie .env.example para .env}
      FARMAERP_APP_PASSWORD: ${FARMAERP_APP_PASSWORD:?Copie .env.example para .env}
    ports:
      # Só na máquina local: o banco nunca fica exposto na rede.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # A partir do Postgres 18, o volume é montado em /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
      - ./db/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-farmaerp}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
