# Versão do PDV para Windows: gera o instalador e, numa tag pdv-v1.2.3, assina e publica na
# homologação (só para os terminais de teste; a liberação para a rede é em /plataforma/versoes).
# Em PR que mexe no instalador, só gera o instalador como artefato, para conferir o pacote.
name: Versão do PDV

on:
  push:
    tags: ['pdv-v*']
  pull_request:
    paths:
      - 'apps/pdv/installer/**'
      - 'apps/pdv/tool/build-installer.ps1'
      - 'apps/pdv/lib/update/**'
      - '.github/workflows/pdv-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (1.2.3), só para gerar o instalador'
        required: true

permissions:
  contents: read

jobs:
  windows:
    name: Instalador Windows
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      API_URL: https://farmaerp-hom-api.b6nhiy.easypanel.host
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Versão
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RUN: ${{ github.run_number }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME.Substring(5) }
                     elseif ($env:EVENT -eq 'workflow_dispatch') { $env:INPUT_VERSION }
                     else { "0.0.$env:RUN" }
          if ($version -notmatch '^\d{1,4}\.\d{1,4}\.\d{1,4}$') { throw "Versão inválida: $version" }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Testes do PDV
        working-directory: apps/pdv
        run: |
          flutter pub get
          flutter test --exclude-tags e2e
      - name: Instalador
        working-directory: apps/pdv
        shell: pwsh
        run: ./tool/build-installer.ps1 -Version ${{ steps.version.outputs.value }} -ApiUrl $env:API_URL -AppEnv homologation
      - uses: actions/upload-artifact@v4
        with:
          name: FarmaERP-PDV-Setup-${{ steps.version.outputs.value }}
          path: apps/pdv/build/installer/FarmaERP-PDV-Setup-${{ steps.version.outputs.value }}.exe
          retention-days: 30
      - name: Publicar na homologação
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          RELEASE_UPLOAD_TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN }}
          RELEASE_API_URL: ${{ env.API_URL }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: node scripts/release/publish-release.mjs "apps/pdv/build/installer/FarmaERP-PDV-Setup-${{ steps.version.outputs.value }}.exe" ${{ steps.version.outputs.value }} windows
