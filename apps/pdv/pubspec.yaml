name: farmaerp_pdv
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cryptography: ^2.9.0
  ffi: 2.2.0
  flutter:
    sdk: flutter
  flutter_lite_camera: 0.2.4
  flutter_onnxruntime: 1.9.1
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  path_provider: ^2.1.6
  pdf: 3.13.1
  sqlite3: 3.9.2
  uuid: ^4.6.0
  win32: 6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Modelos do rosto (Etapa 5): detecção YuNet (MIT), reconhecimento SFace int8 (Apache 2.0) e prova de
  # vida MiniFASNet int8 (Apache 2.0). Rodam no próprio PDV; a imagem nunca sai da memória.
  assets:
    - assets/face/

hooks:
  user_defines:
    sqlite3:
      # SQLite3MultipleCiphers: o banco local fica criptografado (LGPD), sem depender de OpenSSL.
      source: sqlite3mc
